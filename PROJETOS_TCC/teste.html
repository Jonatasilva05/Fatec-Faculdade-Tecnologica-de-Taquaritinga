<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Música</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        input[type="range"] {
            margin-top: 10px;
            width: 300px;
        }
    </style>
</head>
<body>
    <button id="toggleMusic">Tocar Música</button>
    <input id="volumeControl" type="range" min="0" max="1" step="0.01" value="0.5">
    <script>
        const musicButton = document.getElementById('toggleMusic');
const volumeControl = document.getElementById('volumeControl');

// Criação do objeto de áudio
const audio = new Audio('atos2.mp3'); // Substitua 'sua-musica.mp3' pelo caminho do arquivo de áudio
audio.loop = true; // Configura para repetir infinitamente

let isPlaying = false;

// Controle de tocar/parar a música
musicButton.addEventListener('click', () => {
    if (isPlaying) {
        audio.pause();
        musicButton.textContent = 'Tocar Música';
    } else {
        audio.play();
        musicButton.textContent = 'Parar Música';
    }
    isPlaying = !isPlaying;
});

// Controle de volume
volumeControl.addEventListener('input', (event) => {
    audio.volume = event.target.value;
});

    </script>
</body>
</html>
