version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: passwordroot
      MYSQL_DATABASE: meubanco
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - app-network

  # --- NOVO SERVIÇO: PHPMYADMIN ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_container
    links:
      - db
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: passwordroot
    networks:
      - app-network
  # --------------------------------

  backend:
    build: ./backend
    container_name: node_backend
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - app-network
    restart: always 

  frontend:
    build: ./frontend
    container_name: react_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network
    volumes:
      - ./frontend/src:/app/src

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: